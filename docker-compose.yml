services:
  api:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://trials:trials@db:5432/trials
      DATA_DIR: /app/data
      TRIAL_CORPUS_PATH: ${TRIAL_CORPUS_PATH:-/app/data/processed/clinicaltrials/studies.sample.jsonl}
      TRIAL_STORE_PATH: ${TRIAL_STORE_PATH:-/app/data/indexes/studies_sample_trial_store.sqlite}
      BM25_INDEX_PATH: ${BM25_INDEX_PATH:-/app/data/indexes/studies_sample_fielded_bm25.pkl}
      SQLITE_FTS_INDEX_PATH: ${SQLITE_FTS_INDEX_PATH:-/app/data/indexes/studies_sample_sqlite_fts5.sqlite}
      DENSE_INDEX_PATH: ${DENSE_INDEX_PATH:-}
      DENSE_MODEL_NAME: ${DENSE_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      DENSE_TEXT_REPRESENTATION: ${DENSE_TEXT_REPRESENTATION:-title_summary_conditions}
      DENSE_BATCH_SIZE: ${DENSE_BATCH_SIZE:-64}
      DENSE_DEVICE: ${DENSE_DEVICE:-cpu}
      DENSE_MAX_SEQ_LENGTH: ${DENSE_MAX_SEQ_LENGTH:-256}
      DENSE_ENCODER_BACKEND: ${DENSE_ENCODER_BACKEND:-onnxruntime}
      DENSE_ONNX_MODEL_PATH: ${DENSE_ONNX_MODEL_PATH:-/app/data/models/onnx/all-MiniLM-L6-v2}
      RRF_K: ${RRF_K:-60}
      RRF_CANDIDATE_DEPTH: ${RRF_CANDIDATE_DEPTH:-100}
      HF_HOME: /app/data/models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command:
      - sh
      - -c
      - >
        python -m clinical_trial_matching.cli ingest-ctgov-studies
        --input /app/data/fixtures/ctgov_v2_studies.sample.json
        --output /app/data/processed/clinicaltrials/studies.sample.jsonl
        && python -m clinical_trial_matching.cli build-sqlite-fts-index
        --trials /app/data/processed/clinicaltrials/studies.sample.jsonl
        --output /app/data/indexes/studies_sample_sqlite_fts5.sqlite
        --field-weight title=1.25
        --field-weight brief_summary=0.75
        --field-weight conditions=1.5
        --field-weight interventions=0.25
        --field-weight eligibility_criteria=0.5
        && python -m clinical_trial_matching.cli build-trial-store
        --trials /app/data/processed/clinicaltrials/studies.sample.jsonl
        --output /app/data/indexes/studies_sample_trial_store.sqlite
        && uvicorn clinical_trial_matching.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build: .
    environment:
      APP_ENV: local
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command:
      - python
      - -m
      - streamlit
      - run
      - src/clinical_trial_matching/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    depends_on:
      api:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trials
      POSTGRES_PASSWORD: trials
      POSTGRES_DB: trials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trials -d trials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
