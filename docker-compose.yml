services:
  api:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://trials:trials@db:5432/trials
      DATA_DIR: /app/data
      TRIAL_CORPUS_PATH: /app/data/processed/clinicaltrials/studies.sample.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trials
      POSTGRES_PASSWORD: trials
      POSTGRES_DB: trials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trials -d trials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
