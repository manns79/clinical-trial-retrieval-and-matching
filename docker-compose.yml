services:
  api:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://trials:trials@db:5432/trials
      DATA_DIR: /app/data
      TRIAL_CORPUS_PATH: /app/data/processed/clinicaltrials/studies.sample.jsonl
      BM25_INDEX_PATH: /app/data/indexes/studies_sample_fielded_bm25.pkl
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command:
      - sh
      - -c
      - >
        python -m clinical_trial_matching.cli ingest-ctgov-studies
        --input /app/data/fixtures/ctgov_v2_studies.sample.json
        --output /app/data/processed/clinicaltrials/studies.sample.jsonl
        && python -m clinical_trial_matching.cli build-bm25-index
        --trials /app/data/processed/clinicaltrials/studies.sample.jsonl
        --output /app/data/indexes/studies_sample_fielded_bm25.pkl
        --retriever fielded-bm25
        && uvicorn clinical_trial_matching.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build: .
    environment:
      APP_ENV: local
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command:
      - python
      - -m
      - streamlit
      - run
      - src/clinical_trial_matching/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    depends_on:
      api:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trials
      POSTGRES_PASSWORD: trials
      POSTGRES_DB: trials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trials -d trials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
