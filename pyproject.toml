[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clinical-trial-retrieval-and-matching"
version = "0.1.0"
description = "A production-style clinical trial retrieval and evaluation system using public trial records and TREC relevance judgments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Author" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.37",
]
ml = [
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
ctmatch = "clinical_trial_matching.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_trial_matching"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
