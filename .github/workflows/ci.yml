name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Sample baseline
        run: |
          python -m clinical_trial_matching.cli ingest-sample --trials data/fixtures/trials.sample.jsonl --output data/processed/sample_trials.jsonl
          python -m clinical_trial_matching.cli evaluate-baseline --trials data/fixtures/trials.sample.jsonl --topics data/fixtures/topics.sample.jsonl --qrels data/fixtures/qrels.sample.tsv --output outputs/sample_bm25_metrics.json
