name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Sample baseline
        run: |
          python -m clinical_trial_matching.cli ingest-sample --trials data/fixtures/trials.sample.jsonl --output data/processed/sample_trials.jsonl
          python -m clinical_trial_matching.cli ingest-ctgov-studies --input data/fixtures/ctgov_v2_studies.sample.json --output data/processed/clinicaltrials/studies.sample.jsonl
          python -m clinical_trial_matching.cli report-trial-corpus --trials data/processed/clinicaltrials/studies.sample.jsonl --output outputs/clinicaltrials_sample_report.json
          python -m clinical_trial_matching.cli search-trials-bm25 --trials data/processed/clinicaltrials/studies.sample.jsonl --query "adult persistent asthma inhaled corticosteroid" --top-k 5 --output outputs/clinicaltrials_sample_bm25_search.json
          python -m clinical_trial_matching.cli evaluate-baseline --trials data/fixtures/trials.sample.jsonl --topics data/fixtures/topics.sample.jsonl --qrels data/fixtures/qrels.sample.tsv --output outputs/sample_bm25_metrics.json
          python -m clinical_trial_matching.cli evaluate-trec-bm25 --trials data/fixtures/trials.sample.jsonl --topics data/fixtures/topics.sample.jsonl --qrels data/fixtures/qrels.sample.tsv --run-output outputs/sample_bm25.trec --metrics-output outputs/sample_bm25_trec_metrics.json --run-name bm25_fixture
          python -m clinical_trial_matching.cli check-retrieval-regression --trials data/fixtures/trials.sample.jsonl --topics data/fixtures/topics.sample.jsonl --qrels data/fixtures/qrels.sample.tsv --output outputs/retrieval_regression.json
      - name: Sample TREC ingestion
        run: |
          python -m clinical_trial_matching.cli ingest-trec-topics --year 2021 --input data/fixtures/topics2021.sample.xml --output data/processed/trec/2021/topics.jsonl
          python -m clinical_trial_matching.cli ingest-trec-qrels --year 2021 --input data/fixtures/qrels2021.sample.txt --output data/processed/trec/2021/qrels.jsonl
          python -m clinical_trial_matching.cli validate-trec --topics data/processed/trec/2021/topics.jsonl --qrels data/processed/trec/2021/qrels.jsonl --output outputs/sample_trec_validation.json
      - name: Sample source manifest
        run: |
          python -m clinical_trial_matching.cli write-manifest --name sample_trec_2021_topics --dataset trec_clinical_trials --year 2021 --parser trec_topics_xml --source-url https://trec.nist.gov/data/trials/topics2021.xml --input data/fixtures/topics2021.sample.xml --output data/manifests/sample_trec_2021_topics.json --metadata fixture=synthetic

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose config
        run: docker compose config
      - name: Docker build and API smoke check
        run: sh scripts/docker_smoke_check.sh
